[project]
name = "wikicli"
version = "0.1.0"
description = "Personal wiki CLI and harness over a local Gemma model (LM Studio)"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wiki = "wikicli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikicli"]
